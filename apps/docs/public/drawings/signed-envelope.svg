<title id="envelope-env-title">The signed value, with its delivery id inside</title>
<desc id="envelope-env-desc">The canonical string v1, timestamp, delivery id and body sit inside one signed span. A second dimension measures only the delivery id, showing that the id is a term of the signed value rather than a label beside it.</desc>
