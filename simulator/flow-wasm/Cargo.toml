[package]
name = "dakflare-flow-wasm"
version = "6.0.0"
description = "WASM ABI for the DakFlare flow interpreter (Worker fallback)"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib"]

[dependencies]
dakflare-flow = { path = "../flow" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
