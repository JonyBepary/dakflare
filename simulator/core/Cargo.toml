[package]
name = "dakflare-core"
version = "6.1.0"
description = "Device identity, local libSQL store and protocol core for the DakFlare simulator"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
# `core` only: local file access. Remote/replication/TLS features pull a large
# dependency tree and are not needed until embedded replicas land.
libsql = { version = "0.10", default-features = false, features = ["core"] }
p256 = { version = "0.14", features = ["ecdsa", "pem", "pkcs8"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
dakflare-flow = { path = "../flow" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"

[features]
# The default build pulls no protocol client crate and no extra dependency.
default = []
# Opt-in Telegram MTProto adapter (`grammers`). Declared now, empty in the
# default build: `core/src/edge_channels.rs` documents what would live here.
mtproto = []
# Opt-in WhatsApp linked-device adapter (`whatsapp-rust`). Same rule: declaration
# only, so `cargo build` never resolves the crate.
wa-linked = []

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
