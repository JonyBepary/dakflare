[package]
name = "dakflare-core"
version = "0.1.0"
description = "Device identity, local libSQL store and protocol core for the DakFlare simulator"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
# `core` only: local file access. Remote/replication/TLS features pull a large
# dependency tree and are not needed until embedded replicas land.
libsql = { version = "0.10", default-features = false, features = ["core"] }
p256 = { version = "0.14", features = ["ecdsa", "pem", "pkcs8"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
dakflare-flow = { path = "../flow" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# The device socket. Blocking on purpose: the gateway parks one thread in
# `awaitCommand`, so an async runtime would only add a second scheduler to
# reason about. Reuses the rustls+ring pair reqwest already builds for Android.
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
