name: Pipeline

# Checks on every pull request and on every push to main. A push to main that
# passes every check deploys; a manual run deploys any ref once the checks pass.
#
# Nothing here needs a secret except the deploy job, so pull requests from forks
# still get the full check run.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after the checks pass
        type: boolean
        default: true

# A new push supersedes an in-flight run on the same ref, except for main, where
# cancelling would leave a deploy half-finished.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CF_SEND_TELEMETRY: "false"
  DO_NOT_TRACK: "1"
  NODE_VERSION: "22.18"

jobs:
  worker:
    name: Worker types and config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:config

  skills:
    name: Skills match the CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The CLI is zero-dependency, so this needs no install. It reads
      # `capabilities --agent` and fails on an invocation the CLI does not have:
      # a skill that documents a command that is not there is worse than none,
      # because an agent follows it and concludes the deployment is broken.
      - run: node test-support/skills-gate.mjs

  dashboard:
    name: Console types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  simulator:
    name: Simulator types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: simulator/package-lock.json
      - run: npm ci
      - run: npm run check

  rust:
    name: Rust core and flow interpreter
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [simulator/core, simulator/flow]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  suite:
    name: Conformance suite
    needs: worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pinned to the local stack on purpose. The harness reads WORKER_URL, and a
      # production URL here would run the whole suite against production: it
      # creates devices, rules and messages.
      WORKER_URL: http://127.0.0.1:8787
      STUB_URL: http://127.0.0.1:8790
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install the Worker's tooling
        working-directory: worker
        run: npm ci
      # `wrangler dev` reads `.dev.vars`. ADMIN_TOKEN is deliberately not a var,
      # so without this file every admin route fails closed with 401 and `pair`
      # cannot mint a code.
      - name: Local dev secrets
        working-directory: worker
        run: |
          cp .dev.vars.example .dev.vars
          # A random per-run signing secret, never committed. Without it the auth
          # layer answers 503 and the suite's 401 checks fail for the wrong reason.
          echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> .dev.vars
      - name: Start the local stack
        run: |
          ./test-support/dev.sh > "$RUNNER_TEMP/dev.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/dev.pid"
          for _ in $(seq 1 180); do
            if grep -q "Ready on" "$RUNNER_TEMP/dev.log"; then
              echo "local stack ready"
              exit 0
            fi
            sleep 1
          done
          echo "the local stack did not come up:"
          cat "$RUNNER_TEMP/dev.log"
          exit 1
      - name: Pair and run the suite
        run: |
          node dakflare_test_harness.mjs pair
          node dakflare_test_harness.mjs suite
      - name: Stop the local stack
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/dev.pid")" 2>/dev/null || true
          pkill -f "wrangler dev" 2>/dev/null || true

  deploy:
    name: Deploy
    needs: [worker, dashboard, simulator, rust, suite]
    # Push to main, or a manual run that did not opt out. A pull request never
    # reaches this job: it has no secrets and must not touch production.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      || github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Optional: without it the doctor step is skipped, not failed.
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      WORKER_URL: https://dakflare-worker.sohelahmedjony.workers.dev
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      # The console is static assets: it has to exist in worker/public/admin
      # before `cf build` collects the assets directory.
      - run: npm run build:dashboard
      - name: Build
        run: npx cf build
      - name: Deploy
        run: >-
          npx cf deploy --prebuilt
          --tag "${GITHUB_SHA::7}"
          --message "CI deploy ${GITHUB_SHA}"
      - name: Smoke test
        working-directory: .
        run: ./worker/scripts/smoke.sh "$WORKER_URL"
      - name: Doctor
        if: env.ADMIN_TOKEN != ''
        working-directory: .
        run: |
          node cli/bin/dakflare.js init --url "$WORKER_URL" --token "$ADMIN_TOKEN" --force
          node cli/bin/dakflare.js doctor
