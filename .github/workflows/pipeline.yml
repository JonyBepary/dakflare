name: Conformance Pipeline

# Conformance gates on every pull request and push to main.
# This pipeline runs completely air-gapped with ZERO secrets.
#
# Deployment is decoupled from GitHub Actions and sovereignly executed
# by the operator locally via `dakflare up` using their authenticated `cf` session,
# ensuring coordinated radio verification and zero edge credential exposure.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CF_SEND_TELEMETRY: "false"
  DO_NOT_TRACK: "1"
  NODE_VERSION: "22.18"

jobs:
  worker:
    name: Worker types and config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:config
      - run: node scripts/check-versions.mjs
      - run: npm test
      - name: Run Worker node check scripts
        run: |
          for f in src/lib/__checks__/*.mjs src/mcp/__checks__/run.mjs; do
            node --experimental-strip-types "$f" || exit 1
          done

  skills:
    name: Skills match the CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The CLI is zero-dependency, so this needs no install. It reads
      # `capabilities --agent` and fails on an invocation the CLI does not have:
      # a skill that documents a command that is not there is worse than none,
      # because an agent follows it and concludes the deployment is broken.
      - run: node test-support/skills-gate.mjs
      - run: node dakflare_test_harness.mjs selftest
      - run: node dakflare_test_harness.mjs verify-vectors

  dashboard:
    name: Console types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run check
      # The console checks drive a real browser over CDP. A runner has no `chromium` on PATH,
      # so install one and let CHROME_PATH point at it (scripts resolve that first).
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          install-chromedriver: false
      - run: node scripts/agent-patch-check.mjs
      - run: node scripts/assistant-check.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: node scripts/system1-draft-check.mjs
      - run: node scripts/webmcp-check.mjs
      - run: npm run build

  docs:
    name: Docs site builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Prerenders every page and proves the OpenAPI page, the markdown routes and the MCP
      # endpoint still resolve against the installed Fumadocs majors.
      - run: npm run build
      # And build the Worker bundle, which is what actually serves. `next build` passed while the
      # deployed app answered 404 for every route: two routes read the filesystem, and a Worker
      # has none. The bundle build is the step that would have caught it before a deploy did.
      - run: npm run build:worker

  simulator:
    name: Simulator types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: simulator/package-lock.json
      - run: npm ci
      - run: npm run check

  rust:
    name: Rust core and flow interpreter
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [simulator/core, simulator/flow]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  suite:
    name: Conformance suite
    needs: worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pinned to the local stack on purpose. The harness reads WORKER_URL, and a
      # production URL here would run the whole suite against production: it
      # creates devices, rules and messages.
      WORKER_URL: http://127.0.0.1:8787
      STUB_URL: http://127.0.0.1:8790
      # The lease window is the suite's one timing assertion, and a loaded runner
      # can spend longer than 6 s getting the second socket connected. The expiry
      # task then finds no socket, the re-delivery never happens, and the command
      # comes back PENDING with no token, which reads like a product bug and is a
      # stopwatch. `dev.sh` passes LEASE_MS to the Worker as `--var`; the harness
      # reads HARNESS_LEASE_MS. Both sides must name the same number.
      LEASE_MS: "15000"
      HARNESS_LEASE_MS: "15000"
      # `dev.sh` defaults this to 2000 ms, which is right for the platform gate's
      # "a quiet socket is closed" case and wrong here: the lease-recovery section
      # holds a socket deliberately quiet for the whole lease window, and at 2 s
      # the push path ages it out as stale, finds no socket to re-deliver to, and
      # leaves the command PENDING. That reads like a lost command and is a window.
      STALE_SOCKET_MS: "120000"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install the Worker's tooling
        working-directory: worker
        run: npm ci
      # `wrangler dev` reads `.dev.vars`. ADMIN_TOKEN is deliberately not a var,
      # so without this file every admin route fails closed with 401 and `pair`
      # cannot mint a code.
      - name: Local dev secrets
        working-directory: worker
        run: |
          cp .dev.vars.example .dev.vars
          # A random per-run signing secret, never committed. Without it the auth
          # layer answers 503 and the suite's 401 checks fail for the wrong reason.
          echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> .dev.vars
      - name: Start the local stack
        run: |
          ./test-support/dev.sh > "$RUNNER_TEMP/dev.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/dev.pid"
          for _ in $(seq 1 180); do
            if grep -q "Ready on" "$RUNNER_TEMP/dev.log"; then
              echo "local stack ready"
              exit 0
            fi
            sleep 1
          done
          echo "the local stack did not come up:"
          cat "$RUNNER_TEMP/dev.log"
          exit 1
      - name: Pair and run the suite
        run: |
          node dakflare_test_harness.mjs pair
          node dakflare_test_harness.mjs suite
      - name: Stop the local stack
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/dev.pid")" 2>/dev/null || true
          pkill -f "wrangler dev" 2>/dev/null || true
