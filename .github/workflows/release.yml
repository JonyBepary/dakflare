name: Release

# A tag is the release. There is nothing else to press.
#
#   1. bump the version in `cli/bin/dakflare.js` (CLI_VERSION) and `worker/package.json`
#   2. commit, then `git tag v6.3.0 && git push origin v6.3.0`
#
# The tag must agree with both files (worker/scripts/check-versions.mjs), the CLI must pass its
# own syntax gate, and the archive is assembled from the tree at that commit so the artifact
# cannot contain anything the tag does not name.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Tag, verify, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: The tag, the CLI and the Worker must name one version
        run: node worker/scripts/check-versions.mjs "$GITHUB_REF_NAME"

      - name: The CLI must at least parse
        run: node --check cli/bin/dakflare.js

      - name: The harness agrees with itself
        run: |
          node dakflare_test_harness.mjs selftest
          node dakflare_test_harness.mjs verify-vectors

      - name: Install the build dependencies for the pack
        run: |
          npm ci --prefix worker
          npm ci --prefix dashboard

      - name: Build the precompiled Worker pack
        run: node scripts/release/build-pack.mjs --out dist

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Build the standalone CLI binaries
        run: node scripts/release/build-cli.mjs --out dist

      - name: Assemble the CLI archive and pack aliases
        id: archive
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          stage="dist/dakflare-${version}"
          mkdir -p "$stage"
          # What a user actually runs: the CLI, the four skills, the licence and the readme.
          # The Worker and the console are deployed from the precompiled pack.
          cp -r cli skills LICENSE README.md "$stage"/
          tar -czf "dist/dakflare-cli-${version}.tar.gz" -C dist "dakflare-${version}"
          ( cd dist && sha256sum "dakflare-cli-${version}.tar.gz" > "dakflare-cli-${version}.tar.gz.sha256" )
          cp "dist/dakflare-pack-${version}.tar.gz" "dist/dakflare-pack.tar.gz"
          ( cd dist && sha256sum "dakflare-pack.tar.gz" > "dakflare-pack.tar.gz.sha256" )
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Attest the built artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/dakflare-linux-x64
            dist/dakflare-linux-arm64
            dist/dakflare-darwin-x64
            dist/dakflare-darwin-arm64
            dist/dakflare-windows-x64.exe
            dist/dakflare-pack.tar.gz
            dist/dakflare-cli-${{ steps.archive.outputs.version }}.tar.gz

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # A tag with a suffix is a pre-release, and GitHub must agree: `--prerelease` keeps it
          # out of "Latest", so an alpha cannot become the version a newcomer installs.
          kind=""
          case "$GITHUB_REF_NAME" in
            *-alpha*|*-beta*|*-rc*) kind="--prerelease --latest=false" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            "dist/dakflare-cli-${{ steps.archive.outputs.version }}.tar.gz" \
            "dist/dakflare-cli-${{ steps.archive.outputs.version }}.tar.gz.sha256" \
            "dist/dakflare-pack-${{ steps.archive.outputs.version }}.tar.gz" \
            "dist/dakflare-pack.tar.gz" \
            "dist/dakflare-pack.tar.gz.sha256" \
            "dist/dakflare-linux-x64" "dist/dakflare-linux-x64.sha256" \
            "dist/dakflare-linux-arm64" "dist/dakflare-linux-arm64.sha256" \
            "dist/dakflare-darwin-x64" "dist/dakflare-darwin-x64.sha256" \
            "dist/dakflare-darwin-arm64" "dist/dakflare-darwin-arm64.sha256" \
            "dist/dakflare-windows-x64.exe" "dist/dakflare-windows-x64.exe.sha256" \
            --title "DakFlare $GITHUB_REF_NAME" \
            --generate-notes \
            $kind
