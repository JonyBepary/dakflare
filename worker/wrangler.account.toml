# Account-backed development configuration — LOCAL Worker, REAL D1 + KV.
#
#   npx wrangler dev --config wrangler.account.toml --env-file .dev.vars
#
# Why a separate file instead of `[env.account]` in wrangler.toml:
#   * `d1_databases` / `kv_namespaces` are arrays of tables, so `[env.account.d1_databases]`
#     is invalid TOML — it must be `[[env.account.d1_databases]]`.
#   * `durable_objects`, `vars`, `ratelimits` and `triggers` are NOT inherited by an
#     environment, so `[env.account]` would leave `env.DEVICE`, the rate limiters and
#     the FCM base URLs undefined.
#   * `--env` also switches the dev-vars file to `.dev.vars.<env>`, which silently
#     unset ADMIN_TOKEN.
# A full copy is duller but has none of those failure modes. Keep it in sync with
# wrangler.toml — `npm run check:config` diffs the binding names.
#
# POINTS AT THE PREVIEW DATABASE, NEVER PRODUCTION. The conformance suite writes
# rules, messages and devices; those must not land in the database a real phone
# will pair against.

name = "dakflare-worker-staging"
main = "src/index.ts"
compatibility_date = "2026-04-07"
# Required by better-auth (its password utilities import `node:crypto`). The flag
# is inert for code that does not use node: builtins, so it does not change the
# device protocol paths.
compatibility_flags = ["nodejs_compat"]
preview_urls = false

[[durable_objects.bindings]]
name = "DEVICE"
class_name = "DeviceGateway"

# The global failed-auth counter. See lib/auth-limits.ts and wrangler.toml.
[[durable_objects.bindings]]
name = "AUTH_GUARD"
class_name = "AuthGuard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeviceGateway"]

# A new tag, not an edit to v1: v1 is already applied wherever this config has
# run. wrangler.toml uses `[exports.*]` instead; this file keeps the ordered
# migration history because it predates the exports switch.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["AuthGuard"]

# remote = true -> the real preview database, while the Worker and DO run locally.
[[d1_databases]]
binding = "DB"
database_name = "sms_gateway_preview"
database_id = "10ac7c2d-9fcc-45af-9074-6e4329bda700"
remote = true

[[kv_namespaces]]
binding = "KV"
id = "81f51c82606344c59cc3ca2e9e27d0a9"
remote = true

[[ratelimits]]
name = "PAIR_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "ADMIN_LIMITER"
namespace_id = "1002"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "DEVICE_LIMITER"
namespace_id = "1003"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "AUTH_FAIL_LIMITER"
namespace_id = "1004"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "PAIR_GLOBAL_LIMITER"
namespace_id = "1005"
simple = { limit = 300, period = 60 }

# Failed-auth lockout FALLBACK (the authoritative counter is the AUTH_GUARD
# Durable Object above; see lib/auth-limits.ts and wrangler.toml).
[[ratelimits]]
name = "AUTH_ACCOUNT_LIMITER"
namespace_id = "1006"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "AUTH_IP_LIMITER"
namespace_id = "1007"
simple = { limit = 20, period = 60 }

[vars]
# `AUTH_MODE` is retired: one gate, two credentials (Better Auth session, or
# ADMIN_TOKEN plus X-Dakflare-Client: cli). A leftover `AUTH_MODE` here was read
# by nothing and only made this file disagree with the other two.
#
# Which side runs the password KDF: off | client-derived | server-kdf.
AUTH_PASSWORD_MODE = "client-derived"
# Magic-link factor. RESEND_API_KEY is a Worker secret, never a var.
MAGIC_LINK_FROM = "DakFlare <onboarding@resend.dev>"
MAGIC_LINK_TTL_SECONDS = "900"
AUTH_LOCKOUT_WINDOW_SECONDS = "900"
FCM_BASE_URL = "https://fcm.googleapis.com"
GOOGLE_TOKEN_URL = "https://oauth2.googleapis.com/token"
MESSAGE_RETENTION_DAYS = "90"
INCOMING_ROWS_PER_DAY = "10000"
SOURCE_URL = "https://github.com/JonyBepary/dakflare"

[assets]
directory = "public"

[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = true
head_sampling_rate = 1
