# TEMPLATE — copy to `wrangler.toml` for a fresh install.
#
#   cp worker/wrangler.template.toml worker/wrangler.toml
#   cf d1 create sms_gateway                  # then paste the id below, OR
#   cf deploy                                 # automatic provisioning fills them in
#
# Deliberately contains NO `database_id` and NO KV `id`. Those identify *one account's*
# resources; committing them makes the repo deployable only into the author's account.

name = "dakflare-worker"
main = "src/index.ts"
compatibility_date = "2026-04-07"
compatibility_flags = ["nodejs_compat"]
preview_urls = false

# ---------------------------------------------------------------------------
# Durable Object: one DeviceGateway instance per device_id.
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "DEVICE"
class_name = "DeviceGateway"

[[durable_objects.bindings]]
name = "AUTH_GUARD"
class_name = "AuthGuard"

[[durable_objects.bindings]]
name = "AUTHORITY_GUARD"
class_name = "AuthorityGuard"

[exports.DeviceGateway]
type = "durable-object"
storage = "sqlite"

[exports.AuthGuard]
type = "durable-object"
storage = "sqlite"

[exports.AuthorityGuard]
type = "durable-object"
storage = "sqlite"

[exports.FlowExecutionWorkflow]
type = "workflow"

# --- D1 -------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "sms_gateway"
database_id = "<D1_DATABASE_ID>"

# --- KV -------------------------------------------------------------------
[[kv_namespaces]]
binding = "KV"
id = "<KV_NAMESPACE_ID>"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "dakflare-media"

[[queues.producers]]
binding = "WEBHOOK_QUEUE"
queue = "dakflare-webhook-queue"

[[workflows]]
name = "flow-execution-workflow"
binding = "FLOW_WORKFLOW"
class_name = "FlowExecutionWorkflow"

[ai]
binding = "AI"

# --- Rate limiting (hardening S3) -----------------------------------------
[[ratelimits]]
name = "PAIR_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "ADMIN_LIMITER"
namespace_id = "1002"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "DEVICE_LIMITER"
namespace_id = "1003"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "AUTH_FAIL_LIMITER"
namespace_id = "1004"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "PAIR_GLOBAL_LIMITER"
namespace_id = "1005"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "AUTH_ACCOUNT_LIMITER"
namespace_id = "1006"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "AUTH_IP_LIMITER"
namespace_id = "1007"
simple = { limit = 20, period = 60 }

[vars]
AUTH_PASSWORD_MODE = "client-derived"
MAGIC_LINK_FROM = "DakFlare <onboarding@resend.dev>"
MAGIC_LINK_TTL_SECONDS = "900"
AUTH_LOCKOUT_WINDOW_SECONDS = "900"
FCM_BASE_URL = "https://fcm.googleapis.com"
GOOGLE_TOKEN_URL = "https://oauth2.googleapis.com/token"
MESSAGE_RETENTION_DAYS = "90"
INCOMING_ROWS_PER_DAY = "10000"
SOURCE_URL = "https://github.com/OWNER/dakflare"

[assets]
directory = "public"

[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = true
head_sampling_rate = 1
