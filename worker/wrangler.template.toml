# TEMPLATE — copy to `wrangler.toml` for a fresh install.
#
#   cp worker/wrangler.template.toml worker/wrangler.toml
#   cf d1 create sms_gateway                  # then paste the id below, OR
#   cf deploy                                 # automatic provisioning fills them in
#
# Deliberately contains NO `database_id` and NO KV `id`. Those identify *one account's*
# resources; committing them makes the repo deployable only into the author's account.

name = "dakflare-worker"
main = "src/index.ts"
compatibility_date = "2026-04-07"
compatibility_flags = ["nodejs_compat"]
preview_urls = false

# ---------------------------------------------------------------------------
# Durable Object: one DeviceGateway instance per device_id.
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "DEVICE"
class_name = "DeviceGateway"

[[durable_objects.bindings]]
name = "AUTH_GUARD"
class_name = "AuthGuard"

[[durable_objects.bindings]]
name = "AUTHORITY_GUARD"
class_name = "AuthorityGuard"

# The fifth Durable Object: one per external channel account. Addressed by
# `getByName(\`${channel}:${account_id}\`)`, so five WhatsApp numbers are five isolated objects
# rather than one hot one. Holds dedupe, the 24-hour window, and per-account token buckets.
[[durable_objects.bindings]]
name = "CHANNEL_CONN"
class_name = "ChannelConnection"

# The sixth Durable Object: one globally named scheduler holding the clock and
# the token buckets for scheduled sends. D1 is the queue and the only
# cancellation authority; this object never stores a message.
[[durable_objects.bindings]]
name = "SCHEDULER"
class_name = "Scheduler"

[exports.DeviceGateway]
type = "durable-object"
storage = "sqlite"

[exports.AuthGuard]
type = "durable-object"
storage = "sqlite"

[exports.AuthorityGuard]
type = "durable-object"
storage = "sqlite"

[exports.ChannelConnection]
type = "durable-object"
storage = "sqlite"

[exports.Scheduler]
type = "durable-object"
storage = "sqlite"

[exports.FlowExecutionWorkflow]
type = "workflow"
name = "flow-execution-workflow"

# --- D1 -------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "sms_gateway"
database_id = "<D1_DATABASE_ID>"

# --- KV -------------------------------------------------------------------
[[kv_namespaces]]
binding = "KV"
id = "<KV_NAMESPACE_ID>"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "dakflare-media"

[[queues.producers]]
binding = "WEBHOOK_QUEUE"
queue = "dakflare-webhook-queue"

[[queues.consumers]]
queue = "dakflare-webhook-queue"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

# Inbound channel events, coalesced 50-at-a-time into one D1 batch. A dead-letter queue is
# configured rather than leaving a failed batch to vanish after its retries.
[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "dakflare-ingest-queue"

[[queues.consumers]]
queue = "dakflare-ingest-queue"
max_batch_size = 50
max_batch_timeout = 2
max_retries = 3
dead_letter_queue = "dakflare-ingest-dlq"

[[queues.consumers]]
queue = "dakflare-ingest-dlq"
max_batch_size = 50
max_batch_timeout = 5
max_retries = 1

[[workflows]]
name = "flow-execution-workflow"
binding = "FLOW_WORKFLOW"
class_name = "FlowExecutionWorkflow"

[ai]
binding = "AI"

# --- Rate limiting (hardening S3) -----------------------------------------
[[ratelimits]]
name = "PAIR_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "ADMIN_LIMITER"
namespace_id = "1002"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "DEVICE_LIMITER"
namespace_id = "1003"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "AUTH_FAIL_LIMITER"
namespace_id = "1004"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "PAIR_GLOBAL_LIMITER"
namespace_id = "1005"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "AUTH_ACCOUNT_LIMITER"
namespace_id = "1006"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "AUTH_IP_LIMITER"
namespace_id = "1007"
simple = { limit = 20, period = 60 }

[vars]
# Agent runtime (pass 3). `off` keeps /agents/* at 503; the stateless console
# assistant is unaffected. Flip to "on" only after a ticket smoke test.
AGENT_RUNTIME = "off"
# Must match the database's read_replication.mode. "off" skips the D1 session
# wrapper; "on" (the fail-safe default if unset) keeps sequential consistency.
D1_READ_REPLICATION = "off"
# Who may call the worker-to-worker interface (DakFlareApi): `trusted` treats a
# service binding as the credential, `agent_token` requires a dkf_agt_ token per
# call. See src/binding.ts and docs/WORKER_BINDING.md.
BINDING_AUTH = "trusted"
AUTH_PASSWORD_MODE = "client-derived"
MAGIC_LINK_FROM = "DakFlare <onboarding@resend.dev>"
MAGIC_LINK_TTL_SECONDS = "900"
AUTH_LOCKOUT_WINDOW_SECONDS = "900"
FCM_BASE_URL = "https://fcm.googleapis.com"
GOOGLE_TOKEN_URL = "https://oauth2.googleapis.com/token"
MESSAGE_RETENTION_DAYS = "90"
# The System One backend and model come from `ai_settings`, not a var.
# Env defaults for System One, used only while `ai_settings` has no row.
# The provider key is a Worker secret, never a var:
#   cf workers secrets update AI_PROVIDER_API_KEY --worker dakflare-worker --type secret_text   # AI_CHAT_API_KEY / TOKENLAB_API_KEY also work
TOKENLAB_BASE_URL = "https://api.tokenlab.amd.com/v1"
TOKENLAB_SYSTEM1_MODEL = "Clef"
# Console assistant (AI chat). Provider key is a Worker secret, never a var.
AI_CHAT_PROVIDER = "workers-ai"
AI_CHAT_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
AI_CHAT_BASE_URL = ""
AI_DAILY_TOKEN_BUDGET = "20000"
INCOMING_ROWS_PER_DAY = "10000"
SOURCE_URL = "https://github.com/OWNER/dakflare"

[assets]
directory = "public"

[triggers]
crons = ["17 3 * * *", "*/5 * * * *"]

# Split agent Worker (AssistantAgent + MCP + agent conversation routes).
[[services]]
binding = "AGENT_SVC"
service = "dakflare-agent-worker"

[observability]
enabled = true
head_sampling_rate = 1
