# The split agent Worker. Deployed separately from dakflare-worker; reachable
# only through the main Worker's AGENT_SVC service binding.
name = "dakflare-agent-worker"
main = "src/agent-worker.ts"
compatibility_date = "2026-04-07"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "ASSISTANT"
class_name = "AssistantAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AssistantAgent"]

[[d1_databases]]
binding = "DB"
database_name = "sms_gateway"
database_id = "8d88069e-71cf-49a2-ba33-c150b02246b7"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "dakflare-media"

[ai]
binding = "AI"

[[services]]
binding = "CORE"
service = "dakflare-worker"

[vars]
AGENT_RUNTIME = "on"
D1_READ_REPLICATION = "off"

[observability]
enabled = true
head_sampling_rate = 1
