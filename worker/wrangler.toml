# DakFlare v5 — edge backend configuration.
# Implements PROTOCOL_CONTRACT_V5 Rev C/RD (§1 transport, §8 error surface).
#
# ---------------------------------------------------------------------------
# Secrets: this file MUST stay free of secrets. ADMIN_TOKEN and
# FCM_SERVICE_ACCOUNT_JSON come from `.dev.vars` locally or `wrangler secret put`
# remotely. A missing ADMIN_TOKEN fails closed: every admin route answers 401.
#
# PRODUCTION DATA: every binding in THIS file is local. `wrangler dev` therefore
# cannot touch production. The account-backed/production lane lives in
# `wrangler.account.toml` and is used only via `--config` (see test-support/dev.sh).
# The previous revision put `remote = true` here, which meant a bare `wrangler dev`
# wrote straight into the production database. That footgun is removed.
# ---------------------------------------------------------------------------

name = "dakflare-worker"
# Legacy deployment: renamed from "SMS Gateway v5" → DakFlare. The Worker formerly deployed as
# `sms-gateway-worker` at https://sms-gateway-worker.sohelahmedjony.workers.dev; that URL is kept
# only because historical B4b gate logs reference it. A rename deploys a NEW Worker — the old one
# keeps running until you delete it explicitly.
main = "src/index.ts"
compatibility_date = "2026-04-07"

# Preview URLs are public by default and are not part of any route the device
# uses. Keep them off.
preview_urls = false

# ---------------------------------------------------------------------------
# Durable Object: one DeviceGateway instance per device_id.
# `[[migrations]]` with `new_sqlite_classes` remains correct for SQLite-backed
# DOs; declarative `[exports]` is the successor syntax.
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "DEVICE"
# Class name intentionally unchanged: it is the Durable Object identity already bound to deployed
# instances, and renaming it requires a new migration tag. Display name: DakFlareDeviceDO.
class_name = "DeviceGateway"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeviceGateway"]

# ---------------------------------------------------------------------------
# D1 — pairing codes, device registry, message log, rules.
# Local: `wrangler d1 migrations apply sms_gateway --local`.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "sms_gateway"
database_id = "8d88069e-71cf-49a2-ba33-c150b02246b7"

# ---------------------------------------------------------------------------
# KV — load-bearing: lib/fcm.ts caches the FCM HTTP v1 bearer token under a key
# that includes the service-account fingerprint, so rotating the account
# invalidates the cache immediately instead of after ~55 minutes.
#
# KV is eventually consistent in production (up to 60 s propagation) but
# immediately consistent locally; the cache is written to tolerate that.
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "KV"
id = "cabb16caf192453fa17b54b6e0f9d85f"

# ---------------------------------------------------------------------------
# Rate limiting (hardening S3). Backed by the same infrastructure as WAF
# rate-limiting rules. `namespace_id` must be unique per limiter.
#
#   PAIR_LIMITER   unauthenticated POST /v1/device/pair — per IP and one global
#   ADMIN_LIMITER  admin routes — applied AFTER the bearer token is verified, so
#                  random tokens cannot mint fresh keys
#   DEVICE_LIMITER per paired device — applied AFTER the signature is verified
#
# Sized for the conformance suite: it issues ~40 admin calls and a 40+ request
# device burst, so the device/admin windows must stay above that.
# ---------------------------------------------------------------------------
[[ratelimits]]
name = "PAIR_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "ADMIN_LIMITER"
namespace_id = "1002"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "DEVICE_LIMITER"
namespace_id = "1003"
simple = { limit = 600, period = 60 }

[vars]
# Redirectable so the harness can point FCM at a local stub instead of Google.
FCM_BASE_URL = "https://fcm.googleapis.com"
GOOGLE_TOKEN_URL = "https://oauth2.googleapis.com/token"
# Retention window for message bodies and phone numbers (D1 and DO `commands`).
# A product decision, not an engineering default: see OPERATIONS.md.
MESSAGE_RETENTION_DAYS = "90"
# AGPL-3.0 §13: the deployment must offer its source to the people using it.
# Point this at your fork; `/source` redirects here and the landing page links to it.
SOURCE_URL = "https://github.com/jonybepary/dakflare"

# ---------------------------------------------------------------------------
# Static assets (packaging P0). The landing page is served without invoking the
# Worker; unmatched paths fall through to the Worker, so /v1/* and /source keep
# their behaviour and an unknown path still returns the Worker's 404.
#
# When the builder SPA lands, set not_found_handling = "single-page-application"
# and pair it with run_worker_first = ["/v1/*", "/source"] so API 404s and the
# source redirect are not swallowed by the SPA fallback.
# ---------------------------------------------------------------------------
[assets]
directory = "public"

# ---------------------------------------------------------------------------
# Retention cron (hardening S6). 03:17 UTC daily.
# `wrangler dev --test-scheduled` exercises this handler via
# /cdn-cgi/local/scheduled — note that is the CRON handler, not DO alarms.
# ---------------------------------------------------------------------------
[triggers]
crons = ["17 3 * * *"]

# ---------------------------------------------------------------------------
# Workers Logs. Without this the deployment is a black box. Sampling 1.0 is the
# documented default; lower it only once log volume is measured.
# ---------------------------------------------------------------------------
[observability]
enabled = true
head_sampling_rate = 1
