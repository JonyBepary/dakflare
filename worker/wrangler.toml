# SMS Gateway v5 — edge backend configuration.
# Implements PROTOCOL_CONTRACT_V5 Rev C (§1 transport, §8 error surface) and
# master plan §5.1.
#
# ---------------------------------------------------------------------------
# Secrets: this file MUST stay free of secrets. ADMIN_TOKEN and
# FCM_SERVICE_ACCOUNT_JSON are provided through .dev.vars (local, see
# .dev.vars.example) or `wrangler secret put <NAME>` (remote). A non-dev
# ADMIN_TOKEN that is absent fails closed: withAdmin answers 401.
# ---------------------------------------------------------------------------

name = "sms-gateway-worker"
main = "src/index.ts"
compatibility_date = "2026-04-07"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# Durable Object: one DeviceGateway instance per device_id.
# NOTE: the `[[migrations]]` block below is the legacy v1 form and remains
# correct for SQLite-backed Durable Objects. Declarative `[exports]` is the
# successor syntax; do not switch until the migration story is re-verified.
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "DEVICE"
class_name = "DeviceGateway"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeviceGateway"]

# ---------------------------------------------------------------------------
# D1 — pairing codes, device registry, message log, rules.
# Provisioned for real: `wrangler d1 create sms_gateway` (region APAC).
# A real id is required for `--remote` and `deploy`; `--local` treats it as an
# inert local key, which is why the previous revision's all-zero placeholder
# passed locally and then failed the moment `--remote` validated it.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "sms_gateway"
database_id = "8d88069e-71cf-49a2-ba33-c150b02246b7"
# Account-backed mode: `wrangler dev` (no flag) proxies this binding to the real
# D1 database while the Worker and the Durable Object still run locally.
# `wrangler dev --local` disables remote bindings, so the SAME config also serves
# the pure-local lane. Nothing else needs to change to switch between them.
remote = true

# ---------------------------------------------------------------------------
# KV — load-bearing: lib/fcm.ts caches the FCM HTTP v1 bearer token under
# `fcm_bearer_token` so the OAuth2 exchange runs at most once per ~55 minutes
# instead of once per wake push.
# Provisioned for real: `wrangler kv namespace create KV`.
#
# NOTE: KV is eventually consistent in production (up to 60 s propagation) but
# immediately consistent locally. The OAuth token cache is written to tolerate
# that; the local suite cannot prove it, so it is a Tier 2 assertion.
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "KV"
id = "cabb16caf192453fa17b54b6e0f9d85f"
# Same switch as D1 above: remote under `wrangler dev`, local under `--local`.
remote = true

[vars]
# Redirectable so the harness can point FCM at a local stub instead of Google.
FCM_BASE_URL = "https://fcm.googleapis.com"
GOOGLE_TOKEN_URL = "https://oauth2.googleapis.com/token"

# ---------------------------------------------------------------------------
# Workers Logs.
#
# Without this the deployment is a black box: the account-level observability API
# returns nothing for this service, so a production error stays invisible until a
# device misbehaves. Verified: before enabling, a query for this service returned
# zero events while the account had thousands from other sources.
#
# Sampling 1.0 suits a fleet this size. Drop head_sampling_rate if volume matters.
# ---------------------------------------------------------------------------
[observability]
enabled = true
head_sampling_rate = 1
