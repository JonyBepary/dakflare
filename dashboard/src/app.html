<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="description" content="DakFlare SMS gateway operator console" />
		<meta name="theme-color" content="#FBF6EE" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1C1814" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<script>
			// Apply a stored theme before first paint so the console does not flash.
			try {
				var theme = localStorage.getItem('dakflare-theme');
				if (theme === 'light' || theme === 'dark') {
					document.documentElement.dataset.theme = theme;
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
